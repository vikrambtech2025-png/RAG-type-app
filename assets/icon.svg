<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="2" fill="url(#accent)"/>
  <!-- RAG Icon - Chat Bubbles -->
  <g transform="translate(60,45)">
    <rect x="0" y="0" width="90" height="70" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="12" y="15" width="45" height="5" rx="2" fill="#8b5cf6" opacity="0.8"/>
    <rect x="12" y="25" width="35" height="4" rx="2" fill="#64748b"/>
    <rect x="12" y="33" width="40" height="4" rx="2" fill="#64748b"/>
    <rect x="12" y="48" width="50" height="5" rx="2" fill="#a78bfa" opacity="0.6"/>
    <rect x="40" y="75" width="80" height="55" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <rect x="52" y="90" width="55" height="5" rx="2" fill="#a78bfa" opacity="0.8"/>
    <rect x="52" y="100" width="45" height="4" rx="2" fill="#64748b"/>
    <rect x="52" y="108" width="50" height="4" rx="2" fill="#64748b"/>
  </g>
  <!-- Text -->
  <text x="200" y="85" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">RAG Chat</text>
  <text x="200" y="115" font-family="Arial, sans-serif" font-size="16" fill="#8b949e">Multi-Document AI Assistant</text>
  <text x="200" y="145" font-family="monospace" font-size="12" fill="#8b5cf6">LangChain • FAISS • Streamlit • OpenAI</text>
</svg>
